name: "Laya Router"
description: "Local System 1 decision engine & Gemini model/effort router for Hermes Agent"
version: "0.3.0"
slug: "laya"
url: "https://github.com/matthijsberg/HomeAssistant-Addons/tree/main/laya"
arch:
  - amd64
startup: services
boot: auto
video: true
apparmor: false
full_access: true
devices:
  - /dev/dri:/dev/dri
privileged:
  - SYS_ADMIN
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "Laya HTTP API port (null by default; internally accessible via container network)"
options:
  device: "xpu"
  threads: 6
  checkpoints: "english,multilingual"
  router_default: "multilingual"
  laya_revision: "main"
  api_key: ""
  log_level: "info"
  provider: "gemini"
  model_quick: "gemini-2.5-flash-lite"
  model_general: "gemini-flash-latest"
  model_code: "gemini-flash-latest"
  model_deep: "gemini-2.5-pro"
  gateway_url: ""
schema:
  device: "list(xpu|cpu)"
  threads: "int(1,64)"
  checkpoints: "str"
  router_default: "list(multilingual|english)"
  laya_revision: "str"
  api_key: "password"
  log_level: "list(debug|info|warn|warning|error)"
  provider: "list(gemini|litellm|openrouter|custom)"
  model_quick: "str"
  model_general: "str"
  model_code: "str"
  model_deep: "str"
  gateway_url: "str?"
