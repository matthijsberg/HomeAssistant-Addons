name: "Laya Router"
description: "Local sub-100ms System 1 decision engine for Home Assistant, routing LLM prompts and reasoning effort across Gemini, LiteLLM, OpenRouter, and custom gateways"
version: "0.5.0"
slug: "laya"
url: "https://github.com/matthijsberg/HomeAssistant-Addons/tree/main/laya"
arch:
  - amd64
startup: services
boot: auto
ingress: true
ingress_port: 8000
ingress_panel: true
panel_icon: "mdi:router-network"
panel_title: "Laya Router"
video: true
devices:
  - /dev/dri:/dev/dri
ports:
  8000/tcp: null
ports_description:
  8000/tcp: "Laya HTTP API port (null by default; internally accessible via container network)"
options:
  device: "xpu"
  threads: 6
  checkpoints: "english,multilingual"
  router_default: "multilingual"
  laya_revision: "main"
  api_key: ""
  log_level: "info"
  provider: "gemini"
  gateway_url: ""
  families:
    - name: "quick"
      criteria: "small talk, greetings, simple facts, unit conversions, one-step home control commands"
      model: "gemini-3.5-flash-lite"
      effort: "low"
      max_tokens: 1024
      temperature: 0.2
      thinking_budget: 0
    - name: "general"
      criteria: "everyday writing, explaining, summarising, translating, ordinary questions that need a few tool calls"
      model: "gemini-flash-latest"
      effort: "medium"
      max_tokens: 4096
      temperature: 0.7
    - name: "code"
      criteria: "writing or debugging code or configuration files, multi-step tool or agent work"
      model: "gemini-flash-latest"
      effort: "high"
      max_tokens: 8192
      temperature: 0.1
    - name: "deep"
      criteria: "hard reasoning where a wrong answer is costly: maths, finance, planning, comparing complex options"
      model: "gemini-2.5-pro"
      effort: "high"
      max_tokens: 8192
      temperature: 0.2
schema:
  device: "list(xpu|cpu)"
  threads: "int(1,64)"
  checkpoints: "str"
  router_default: "list(multilingual|english)"
  laya_revision: "str"
  api_key: "password"
  log_level: "list(debug|info|warn|warning|error)"
  provider: "list(gemini|litellm|openrouter|custom)"
  gateway_url: "str?"
  model_quick: "str?"
  model_general: "str?"
  model_code: "str?"
  model_deep: "str?"
  families:
    - name: "str"
      criteria: "str"
      model: "str"
      effort: "list(low|medium|high)?"
      max_tokens: "int?"
      temperature: "float?"
      thinking_budget: "int?"
