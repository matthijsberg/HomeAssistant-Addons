name: "Open HEMS"
description: "Open-source Home Energy Management System: predictive heat pump, solar, dynamic tariffs, and battery dispatch."
version: "0.41.0"
slug: "open_hems"
init: false
arch:
  - aarch64
  - amd64
url: "https://github.com/matthijsberg/ha-addon-open-hems"
panel_icon: "mdi:lightning-bolt"
ingress: true
ingress_port: 8099
homeassistant_api: true
environment:
  TZ: "Europe/Amsterdam"
startup: services
boot: auto
map:
  - config:rw
  - share:rw
  - data:rw
options:
  site_config: "/config/projects/energy-scheduler/config/heatpump_config.json"
  auto_dispatch: true
  sync_interval_minutes: 15
  log_level: "info"
schema:
  site_config: "str"
  auto_dispatch: "bool"
  sync_interval_minutes: "int"
  log_level: "match(trace|debug|info|warn|error)"
