name: Build Langfuse Add-on

on:
  push:
    branches:
      - main
    paths:
      - "langfuse/**"
      - ".github/workflows/addon-langfuse.yml"
  pull_request:
    paths:
      - "langfuse/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Scaffolding & Quality Checks
        run: |
          cd langfuse
          ./scripts/setup.sh

  build:
    name: Build & Publish GHCR Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --target langfuse \
            --image "{arch}-addon-langfuse" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --amd64 \
            --aarch64
