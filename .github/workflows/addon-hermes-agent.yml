name: Hermes Agent Add-on

on:
  push:
    branches:
      - main
    paths:
      - "hermes_agent/**"
      - ".github/workflows/addon-hermes-agent.yml"
  pull_request:
    paths:
      - "hermes_agent/**"
      - ".github/workflows/addon-hermes-agent.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruamel.yaml

      - name: Run quality gates
        run: |
          cd hermes_agent
          ./scripts/setup.sh
