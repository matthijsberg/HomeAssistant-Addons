name: "Langfuse"
description: "Self-hosted LLM observability & prompt management (Langfuse v4)"
version: "4.0.0-12"
slug: "langfuse"
url: "https://github.com/matthijsberg/HomeAssistant-Addons/tree/main/langfuse"
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
timeout: 120
backup: cold
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_icon: "mdi:chart-timeline-variant"
panel_title: "Langfuse"
panel_admin: true
map:
  - "share:rw"
  - "ssl:ro"

ports:
  3000/tcp: null
ports_description:
  3000/tcp: "Direct LAN UI and SDK/OTLP ingestion (optional; leave empty for Ingress-only)"

options:
  admin_email: null
  admin_password: null
  retention_days: 30
  clickhouse_memory_limit_mb: 4096
  node_max_old_space_mb: 2048
  export_hermes_env: false
  telemetry_enabled: false
  log_level: "info"

schema:
  admin_email: email
  admin_password: password
  retention_days: int(0,3650)
  clickhouse_memory_limit_mb: int(1024,16384)
  node_max_old_space_mb: int(512,8192)
  export_hermes_env: bool
  telemetry_enabled: bool
  log_level: list(debug|info|warn|error)
