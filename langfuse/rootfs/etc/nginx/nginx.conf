daemon off;
user root;
pid /run/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Upstream Langfuse Web server
    upstream langfuse_backend {
        server 127.0.0.1:3100;
        keepalive 32;
    }

    # ========================================================
    # 1. Home Assistant Ingress Listener (Port 8099)
    # ========================================================
    server {
        listen 8099 default_server;
        server_name _;

        # Security: accept connections from Home Assistant internal network & local
        allow 172.30.32.0/23;
        allow 127.0.0.1;
        deny all;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable response compression from upstream so sub_filter can rewrite URLs
        proxy_set_header Accept-Encoding "";

        # Strip frame-blocking headers so HA frontend can render Ingress iframe
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors 'self' *" always;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Rewrite origin-agnostic auth redirects
            proxy_redirect ~^http://langfuse\.invalid(.*)$ $1;

            # Ingress dynamic base-path & asset rewrites
            sub_filter_once off;
            sub_filter_types application/json application/javascript;
            sub_filter '"buildId":' '"basePath":"$http_x_ingress_path","assetPrefix":"$http_x_ingress_path","buildId":';
            sub_filter '"basePath":""' '"basePath":"$http_x_ingress_path"';
            sub_filter '"/_next/' '"$http_x_ingress_path/_next/';
            sub_filter "'/_next/" "'$http_x_ingress_path/_next/";
            sub_filter 'src="/_next/' 'src="$http_x_ingress_path/_next/';
            sub_filter 'href="/_next/' 'href="$http_x_ingress_path/_next/';
            sub_filter 'href="/icon' 'href="$http_x_ingress_path/icon';
            sub_filter '<head>' '<head><script>(function(){var p="$http_x_ingress_path";if(!p||p===""||p.charAt(0)!=="/")return;var f=window.fetch;window.fetch=function(u,i){if(typeof u==="string"&&(u.startsWith("/api/")||u.startsWith("/_next/"))){u=p+u;}else if(u&&u.url){try{var parsed=new URL(u.url);if(parsed.origin===window.location.origin&&(parsed.pathname.startsWith("/api/")||parsed.pathname.startsWith("/_next/"))){u=new Request(p+parsed.pathname+parsed.search,u);}}catch(e){}}return f.call(this,u,i);};var o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(typeof u==="string"&&(u.startsWith("/api/")||u.startsWith("/_next/"))){u=p+u;}return o.apply(this,arguments);};var ps=history.pushState;history.pushState=function(s,t,u){if(typeof u==="string"&&u.startsWith("/")&&!u.startsWith(p)){u=p+u;}return ps.apply(this,arguments);};var rs=history.replaceState;history.replaceState=function(s,t,u){if(typeof u==="string"&&u.startsWith("/")&&!u.startsWith(p)){u=p+u;}return rs.apply(this,arguments);};})();</script><base href="$http_x_ingress_path/">';
        }
    }

    # ========================================================
    # 2. LAN / API Ingestion Listener (Port 3000, Optional)
    # ========================================================
    server {
        include /run/nginx_port_3000.conf;
        server_name _;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
