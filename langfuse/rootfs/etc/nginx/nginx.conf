daemon off;
user root;
pid /run/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Upstream Langfuse Web server
    upstream langfuse_backend {
        server 127.0.0.1:3100;
        keepalive 32;
    }

    # ========================================================
    # 1. Home Assistant Ingress Listener (Port 8099)
    # ========================================================
    server {
        listen 8099 default_server;
        server_name _;

        # Security: strictly accept connections only from Home Assistant Supervisor
        allow 172.30.32.2;
        deny all;

        # Disable response compression from upstream so sub_filter can rewrite URLs
        proxy_set_header Accept-Encoding "";

        # Strip frame-blocking headers so HA frontend can render Ingress iframe
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors 'self' *" always;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Rewrite origin-agnostic auth redirects
            proxy_redirect ~^http://langfuse\.invalid(.*)$ $1;
            sub_filter 'http://langfuse.invalid' '';
            sub_filter_once off;
            sub_filter_types application/json text/html;
        }
    }

    # ========================================================
    # 2. LAN / API Ingestion Listener (Port 3000, Optional)
    # ========================================================
    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
