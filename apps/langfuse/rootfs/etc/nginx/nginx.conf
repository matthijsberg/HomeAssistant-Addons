daemon off;
user root;
pid /run/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    # Upstream Langfuse Web server
    upstream langfuse_backend {
        server 127.0.0.1:3100;
        keepalive 32;
    }

    # ========================================================
    # 1. Home Assistant Ingress Listener (Port 8099)
    # ========================================================
    server {
        listen 8099 default_server;
        server_name _;

        # Security: accept connections from Home Assistant internal network & local
        allow 172.30.32.0/23;
        allow 127.0.0.1;
        deny all;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable response compression from upstream so sub_filter can rewrite URLs
        proxy_set_header Accept-Encoding "";

        # Strip frame-blocking headers so HA frontend can render Ingress iframe
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors 'self' *" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        location / {
            # If requesting root without session cookie, route to sign-in directly
            if ($http_cookie !~* "next-auth\.session-token") {
                rewrite ^/$ /auth/sign-in break;
            }

            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Rewrite origin-agnostic auth redirects
            proxy_redirect ~^https?://[^/]+(.*)$ $http_x_ingress_path$1;
            proxy_redirect / $http_x_ingress_path/;

            # Ingress dynamic base-path & asset rewrites
            sub_filter_once off;
            sub_filter_types application/json application/javascript text/javascript;
            sub_filter '"buildId":' '"basePath":"$http_x_ingress_path","assetPrefix":"$http_x_ingress_path","buildId":';
            sub_filter '"basePath":""' '"basePath":"$http_x_ingress_path"';
            sub_filter '"/_next/' '"$http_x_ingress_path/_next/';
            sub_filter "'/_next/" "'$http_x_ingress_path/_next/";
            sub_filter 'src="/' 'src="$http_x_ingress_path/';
            sub_filter 'href="/' 'href="$http_x_ingress_path/';
            sub_filter 'action="/' 'action="$http_x_ingress_path/';
            sub_filter '<head>' '<head><meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"><script>(function(){var p="$http_x_ingress_path";if(!p||p===""||p.charAt(0)!=="/")return;function rewrite(s){if(!s||typeof s!=="string")return s;try{var u=new URL(s,window.location.href);if(u.origin===window.location.origin&&u.pathname.startsWith("/")&&!u.pathname.startsWith(p)){return p+u.pathname+u.search+u.hash;}}catch(e){}return s;}var f=window.fetch;window.fetch=function(input,init){if(typeof input==="string"){input=rewrite(input);}else if(input&&input.url){var rw=rewrite(input.url);if(rw!==input.url){input=new Request(rw,input);}}return f.call(this,input,init);};var op=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url){if(typeof url==="string"){url=rewrite(url);}return op.apply(this,arguments);};var ps=history.pushState;history.pushState=function(s,t,u){if(typeof u==="string"){u=rewrite(u);}return ps.apply(this,arguments);};var rs=history.replaceState;history.replaceState=function(s,t,u){if(typeof u==="string"){u=rewrite(u);}return rs.apply(this,arguments);};})();</script><base href="$http_x_ingress_path/">';
        }
    }

    # ========================================================
    # 2. LAN / API Ingestion Listener (Port 3000, Optional)
    # ========================================================
    server {
        include /run/nginx_port_3000.conf;
        server_name _;

        location / {
            proxy_pass http://langfuse_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
